version: 2.1 # Upgrading to 2.1 allows for better features, though 2.0 still works
jobs:
  build:
    docker:
      # Use a modern Node version (e.g., 18 or 20)
      - image: cimg/node:14.21-browsers 
        environment:
          CHROME_BIN: "/usr/bin/google-chrome"
    steps:
      - checkout
      - run:
          name: Clean Install
          command: |
            rm -rf node_modules
            npm install
      - run:
          name: Build Project
          command: ./node_modules/.bin/ember build --environment=production
