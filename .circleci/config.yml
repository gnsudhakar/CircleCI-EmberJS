version: 2.1 # Upgrading to 2.1 allows for better features, though 2.0 still works
jobs:
  build:
    docker:
      # Use a modern Node version (e.g., 18 or 20)
      - image: cimg/node:18.19-browsers 
        environment:
          CHROME_BIN: "/usr/bin/google-chrome"
    steps:
      - checkout
      - run: 
          name: Install Dependencies
          command: npm install
      - run: 
          name: Run Ember
          # Note: 'ember serve' usually blocks the CI; 
          # you likely want 'ember build' or 'ember test' here.
          command: npx ember build
